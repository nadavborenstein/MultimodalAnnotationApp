claim_identification:
  question: Does the Tweet text (💬) make a claim? (either explicitly or implicitly)
  mandatory_text: no
  explanation: Here we focus only on the Tweet's text, and not the image and/or text embedded within the image.
  answers:
    I don't know:
      label: unsure
    no:
      question: Does the image (🖼️) contain any text?
      mandatory_text: no
      explanation: In this case, we do not care about small spans of text that appears in a natural scene, like a street name on a traffic sign, unless the text is significant to the claim.
      answers:
        I don't know:
          label: unsure
        no:
          label: no text in image
        yes:
          question: Does the text in the image (🖼️) contain a claim?
          mandatory_text: yes-both
          explanation: If yes, what is it?
          answers:
            I don't know:
              label: unsure
            yes:
              label: textual claim in image
            no:
              label: no textual claim in the text
      yes:
        question: Does the image (🖼️) contain any text?
        mandatory_text: no
        explanation: In this case, we do not care about small spans of text that appears in a natural scene, like a street name on a traffic sign, unless the text is significant to the claim.
        answers:
          I don't know:
            label: unsure
          no:
            label: no text in image
          yes:
            question: Does the text in the image (🖼️) contain a claim?
            mandatory_text: yes-both
            explanation: If yes, what is it?
            answers:
              I don't know:
                label: unsure
              yes:
                label: textual claim in image
              no:
                label: no textual claim in the text

image:
  question: Does the image seem fake, edited, AI-generated, or manipulated in any way?
  mandatory_text: no
  explanation: Please consult the "Additional Context" if you are not sure.
  answers:
    I don't know:
      label: unsure
    no:
      question: Does the image depict information from an unreliable or unverifiable source (e.g., parody accounts, impostors, etc.)? If so, who?
      mandatory_text: yes-yes
      explanation: For example, does the image contain **screenshots** depicting unreliable accounts or media platforms? **Importantly**, answer "Yes" only if the "Additional Context" determined that the source is unreliable or unverifiable (do not rely on your own intuition). 
      answers:
        I don't know:
          label: unsure
        yes:
          label: unreliable
        no:
          question: Is there anything wrong or misleading about the image, *independent of the tweet's text*?
          mandatory_text: yes-yes
          explanation: Please consult the "Additional Context" if you are not sure.
          answers:
            unsure:
              label: unsure
            no:
              label: Nothing wrong
            yes:
              label: other misleading
    yes:
      question: Is the image completely AI-generated?
      mandatory_text: no
      explanation: Is it a fake image that was created entirely by AI? If the image is based on a real image, answer "no".
      answers:
        yes:
          question: Does the tweet claim or insinuate that the AI-generated image is authentic?
          mandatory_text: no
          explanation: That is, is the tweet misleading because it claims that a fake image is real?
          answers:
            I don't know:
              label: unsure
            yes:
              label: AI-generated
            no:
              label: benign edits
        no:
          question: Does the image contain any fake information? If yes, what are they?
          mandatory_text: yes-yes
          explanation: For example, does the image contain fake headlines, fake quotes, or fake statistics?
          answers:
            I don't know:
              label: unsure
            yes:
              label: fabricated
            no:
              question: Are the edits or manipulations misleading? i.e., are these edits the source of the misinformation? If so, what are they?
              mandatory_text: yes-yes
              explanation: For example, do the edits mislead people by creating false evidence for the claim, omitting a key part of the image, or falsely labelling the image? Non-misleading edits could include changes that do not affect the meaning of the image, e.g., creating a collage.
              answers:
                I don't know:
                  label: unsure
                yes:
                  label: manipulated
                no:
                  label: benign edits
          
text:
  question: Would the claim (made by 💬 and/or 🖼️) be clear or complete even without the image?
  mandatory_text: no
  explanation: Example of "Yes:" attaching an image of an American flag to a tweet containing a claim about the American job market.\nExample of "No:" attaching an image of a graph that shows data about the American job market to a tweet discussing the data. 
  answers:
    I don't know:
      label: unsure
    yes:
      question: Does the claim (💬 and/or 🖼️) refer to the image at all? 
      mandatory_text: no
      explanation: Answer "No" if the claim is completely independent of the image, and the image's only purpose to make the post more attractive or attention-grabbing.
      answers:
        I don't know:
          label: unsure
        yes:
          question: Does the tweet claim that the image is fake, edited, or staged?
          mandatory_text: no
          explanation: That is, does the tweet **deny** the authenticity or validity of the image?
          answers:
            I don't know:
              label: unsure
            yes:
              label: denial
            no:
              question: Does the text make an incorrect claim about the content or context of the image (e.g., incorrect time/place, wrong person, incorrect event)? If yes, specify what it is.
              mandatory_text: yes-yes
              explanation: Focus on **factual** mismatches between the content of the image and the content of Tweet text.
              answers:
                I don't know:
                  label: unsure
                yes:
                  label: mismatch
                no:
                  question: Does the text describe the image in a misleading way?
                  mandatory_text: yes-both
                  explanation: Does the text misinterpret (intentionally or unintentionally) the meaning or consequences of the image (e.g., drawing false or exaggerated conclusions from the image)?
                  answers:
                    I don't know:
                      label: unsure
                    yes:
                      label: slanted
                    no:
                      question: other issues
        no:
          label: decorative
    no:
      question: Does the tweet claim that the image is fake, edited, or staged?
      mandatory_text: no
      explanation: That is, does the tweet **deny** the authenticity or validity of the image?
      answers:
        I don't know:
          label: unsure
        yes:
          label: denial
        no:
          question: Does the text make an incorrect claim about the content or context of the image (e.g., incorrect time/place, wrong person, incorrect event)? If yes, specify what it is.
          mandatory_text: yes-yes
          explanation: Focus on **factual** mismatches between the content of the image and the content of Tweet text.
          answers:
            I don't know:
              label: unsure
            yes:
              label: mismatch
            no:
              question: Does the text describe the image in a misleading way?
              mandatory_text: yes-both
              explanation: Does the text misinterpret (intentionally or unintentionally) the meaning or consequences of the image (e.g., drawing false or exaggerated conclusions from the image)?
              answers:
                I don't know:
                  label: unsure
                yes:
                  label: slanted
                no:
                  question: other issues
